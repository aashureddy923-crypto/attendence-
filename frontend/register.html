<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body>
    <div class="container-fluid text-center">
        <h1>Register</h1>
        <form>
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter username">

            <label class="form-label mt-3">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com">

            <label class="form-label mt-3">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password">

            <label class="form-label mt-3">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">

            <button id="register-button" class="btn btn-primary mt-3">
                Register
            </button>
            <p class="mt-3">
                Already have an account?
                <a href="login.html">click here to login</a>
            </p>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09cYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="register.js"></script>
    <script src="login.js"></script>
</body>
</html>
